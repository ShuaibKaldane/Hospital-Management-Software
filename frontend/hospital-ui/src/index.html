<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MediCare+ · Hospital Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MediCare+ — a modern hospital management platform for admins, doctors and patients.">
  <meta name="theme-color" content="#0E7490">

  <!-- Professional font stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Inline SVG favicon: medical cross -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7490'/%3E%3Cpath d='M14 8h4v6h6v4h-6v6h-4v-6H8v-4h6V8z' fill='white'/%3E%3C/svg%3E">

  <!-- Apply saved theme before Angular bootstraps (no flash). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('medicare_theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root>
    <!-- Initial loading splash, replaced once Angular boots -->
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',system-ui,sans-serif;color:#0E7490;background:#F8FAFC">
      <div style="text-align:center">
        <div style="width:56px;height:56px;border:4px solid #E2E8F0;border-top-color:#0E7490;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite"></div>
        <div style="font-weight:600;letter-spacing:.5px">Loading MediCare+…</div>
      </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </app-root>
</body>
</html>
